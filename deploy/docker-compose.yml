# HEMORA production service (/opt/hemora on the server).
#
# The server already runs a shared Caddy reverse proxy (n8n-caddy-1) that owns ports 80/443,
# so this stack publishes no ports. The web container joins that proxy's Docker network
# (PROXY_NETWORK in /opt/hemora/.env) under the alias "hemora-web", and the proxy's
# Caddyfile routes the site to hemora-web:3000 (see deploy/Caddyfile.site and
# deploy/attach-to-proxy.sh).
name: hemora

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/taufikandrian18/hemora:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - hemora-web
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in /opt/hemora/.env (run deploy/attach-to-proxy.sh)}
