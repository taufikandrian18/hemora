# Production stack on the server (/opt/hemora). The deploy workflow copies this file
# and the Caddyfile to the server, then runs `docker compose pull web && docker compose up -d`.
name: hemora

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/taufikandrian18/hemora:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ":80" serves plain HTTP on the IP. Set a domain (e.g. "hemora.id, www.hemora.id")
      # in /opt/hemora/.env and Caddy obtains HTTPS certificates automatically.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
