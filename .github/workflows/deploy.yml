name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/taufikandrian18/hemora
  # Public URL prefix: https://website.taufikandrian.my.id/hemora
  BASE_PATH: /hemora

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ env.BASE_PATH }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload stack files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" 'mkdir -p /opt/hemora/wordpress/mu-plugins'
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile.routes deploy/attach-to-proxy.sh "$TARGET:/opt/hemora/"
          scp -i ~/.ssh/deploy_key deploy/wordpress/htaccess deploy/wordpress/uploads.ini "$TARGET:/opt/hemora/wordpress/"
          scp -i ~/.ssh/deploy_key deploy/wordpress/mu-plugins/*.php "$TARGET:/opt/hemora/wordpress/mu-plugins/"

      - name: Pull and restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          WEB_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "WEB_IMAGE='$WEB_IMAGE' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/hemora
          for key in PROXY_NETWORK WP_URL WP_DB_PASSWORD WP_DB_ROOT_PASSWORD REVALIDATE_SECRET; do
            grep -q "^$key=" .env || { echo "$key missing in /opt/hemora/.env - see docs/DEPLOYMENT.md." >&2; exit 1; }
          done
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Pin the running image so a manual `docker compose up -d` keeps this release.
          sed -i '/^WEB_IMAGE=/d' .env && echo "WEB_IMAGE=$WEB_IMAGE" >> .env
          docker compose pull web
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          for attempt in $(seq 1 30); do
            if docker compose exec -T web sh -c 'wget -qO- "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/api/health"' >/dev/null 2>&1; then
              echo "Healthy: $WEB_IMAGE"
              # Pages are prerendered with built-in copy in CI; pull WordPress content in now.
              docker compose exec -T web sh -c 'wget -qO- --post-data="" --header="x-hemora-secret: $REVALIDATE_SECRET" "http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH}/api/revalidate"' >/dev/null 2>&1 || echo "Content refresh skipped"
              for path in "" /lereng /sriti; do
                docker compose exec -T web sh -c "wget -qO- \"http://127.0.0.1:3000\${NEXT_PUBLIC_BASE_PATH}$path\"" >/dev/null 2>&1 || true
              done
              # Shared server: prune only superseded HEMORA images, never other projects'.
              docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/taufikandrian18/hemora" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed for $WEB_IMAGE" >&2
          docker compose logs --tail=80 web >&2
          exit 1
          REMOTE
